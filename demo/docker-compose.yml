services:
  atrium-host:
    build:
      context: ..
      dockerfile: demo/Dockerfile.agent
    command: bun run apps/atrium/host/src/index.ts
    environment:
      ATRIUM_DB_PATH: /data/atrium.db
      PORT: "8787"
      ATRIUM_ALLOW_REREGISTER: "1"
    # Host port only; agents still use http://atrium-host:8787 on the compose network.
    ports:
      - "${DEMO_HOST_PORT:-8787}:8787"
    volumes:
      - atrium-db:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(async r=>{if(!r.ok)process.exit(1);const j=await r.json().catch(()=>null);process.exit(j&&j.ok===true?0:1)})",
        ]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  agent-alice:
    build:
      context: ..
      dockerfile: demo/Dockerfile.agent
    environment:
      ATRIUM_BASE_URL: http://atrium-host:8787
      ATRIUM_DATA_DIR: /data
      HOME: /data
      ATRIUM_AGENT_KEY_PATH: /data/identity.json
      AGENT_USERNAME: alice
      AGENT_PEER_USERNAME: bob
      VELLUM_BASE_URL: http://atrium-host:8787
      VELLUM_ATRIUM_BASE_URL: http://atrium-host:8787
    volumes:
      - alice-data:/data
      - demo-sync:/sync
    command: ["sh", "/app/demo/scripts/agent-lifecycle.sh"]
    depends_on:
      atrium-host:
        condition: service_healthy

  agent-bob:
    build:
      context: ..
      dockerfile: demo/Dockerfile.agent
    environment:
      ATRIUM_BASE_URL: http://atrium-host:8787
      ATRIUM_DATA_DIR: /data
      HOME: /data
      ATRIUM_AGENT_KEY_PATH: /data/identity.json
      AGENT_USERNAME: bob
      AGENT_PEER_USERNAME: alice
      VELLUM_BASE_URL: http://atrium-host:8787
      VELLUM_ATRIUM_BASE_URL: http://atrium-host:8787
    volumes:
      - bob-data:/data
      - demo-sync:/sync
    command: ["sh", "/app/demo/scripts/agent-lifecycle.sh"]
    depends_on:
      atrium-host:
        condition: service_healthy

volumes:
  atrium-db:
  alice-data:
  bob-data:
  demo-sync:
