name: release khora-cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Run npm publish --dry-run; skip git tag/push"
        required: false
        type: boolean
        default: false
      registry_url:
        description: "Registry URL baked into CLI default and packaged configs"
        required: true
        type: string
        default: https://r.khoralabs.com

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      KHORA_RELEASE_REGISTRY_URL: ${{ inputs.registry_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot clone sibling private org repos (e.g. libs).
          # Submodules are initialized in the next step with KHORALABS_SUBMODULES_TOKEN.

      - name: init submodules
        env:
          # Fine-grained PAT (or classic repo-scoped) with Contents: Read on private
          # khoralabs/* submodule remotes (libs, chat, …).
          TOKEN: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::KHORALABS_SUBMODULES_TOKEN secret is empty or unset"
            exit 1
          fi
          # scp-style git@host:path URLs often skip url.insteadOf; rewrite to HTTPS first.
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: verify submodules
        run: |
          set -euo pipefail
          test -d vendor/chat
          test -d vendor/libs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: |
          bun test apps/khora/cli apps/khora/daemon apps/khora/plugins/inbox-buffer scripts/stage-khora-release.test.ts scripts/homebrew-khora.test.ts
          bun test packages/khora/client

      - name: build json schema
        run: bun run --cwd packages/khora/client build:schema

      - name: cross-compile native binaries
        run: |
          set -euo pipefail
          for slug in darwin-arm64 linux-x64 linux-arm64; do
            echo "::group::cli bun-$slug"
            bun run apps/khora/cli/scripts/build.ts "bun-$slug"
            echo "::endgroup::"
            echo "::group::daemon bun-$slug"
            bun run apps/khora/daemon/scripts/build.ts "bun-$slug"
            echo "::endgroup::"
          done

      - name: smoke-test compiled binaries
        run: bun run scripts/verify-khora-release-binaries.ts

      - name: stage release packages
        run: bun run scripts/stage-khora-release.ts "$VERSION" --registry-url="$KHORA_RELEASE_REGISTRY_URL"

      - name: package release tarballs
        run: bun run scripts/package-khora-release-tarballs.ts "$VERSION"

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: verify npm publish access to @khoralabs
        run: |
          set -euo pipefail
          echo "npm user: $(npm whoami)"
          echo "Dry-run first platform package (404 here = no publish rights on @khoralabs scope)..."
          (cd apps/khora/release/cli-darwin-arm64 && npm publish --access public --tag "$NPM_TAG" --dry-run)

      - name: publish platform packages
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi
          for slug in \
            cli-darwin-arm64 cli-linux-x64 cli-linux-arm64 \
            daemon-darwin-arm64 daemon-linux-x64 daemon-linux-arm64; do
            echo "::group::publish $slug"
            (cd "apps/khora/release/$slug" && npm publish --access public --tag "$NPM_TAG" $DRY_FLAG)
            echo "::endgroup::"
          done

      - name: publish daemon meta
        working-directory: apps/khora/release/daemon
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --tag "$NPM_TAG" --dry-run
          else
            npm publish --access public --tag "$NPM_TAG"
          fi

      - name: publish cli meta
        working-directory: apps/khora/release/cli
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --tag "$NPM_TAG" --dry-run
          else
            npm publish --access public --tag "$NPM_TAG"
          fi

      - name: align latest dist-tag on all packages
        if: ${{ inputs.dry_run == false && inputs.tag == 'latest' }}
        run: |
          set -euo pipefail
          for pkg in \
            @khoralabs/khora-cli-darwin-arm64 \
            @khoralabs/khora-cli-linux-x64 \
            @khoralabs/khora-cli-linux-arm64 \
            @khoralabs/khora-daemon-darwin-arm64 \
            @khoralabs/khora-daemon-linux-x64 \
            @khoralabs/khora-daemon-linux-arm64 \
            @khoralabs/khora-daemon \
            @khoralabs/khora-cli; do
            npm dist-tag add "${pkg}@${VERSION}" latest
          done

      - name: create GitHub release
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is empty or unset (needed to publish public release assets)"
            exit 1
          fi
          gh release create "khora-cli-v${VERSION}" \
            apps/khora/release/tarballs/*.tar.gz \
            --repo khoralabs/homebrew-tap \
            --title "khora-cli v${VERSION}" \
            --generate-notes

      - name: bump homebrew formula
        if: ${{ inputs.dry_run == false }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: bun run scripts/bump-homebrew-khora-formula.ts "$VERSION"

      - name: commit homebrew formula
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew-tap/Formula/khora.rb
          git diff --staged --quiet || git commit -m "chore(homebrew): khora-cli@${VERSION}"
          # Other release workflows may push to main concurrently; rebase and retry.
          # --autostash: release builds leave unstaged artifacts that block rebase.
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if HUSKY=0 git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${branch}..."
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push homebrew formula after retries"
          exit 1
