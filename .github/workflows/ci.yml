name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Released surfaces: @khoralabs/khora-client (npm), khora-cli, khora-server.
  # Mirrors the test/build gates of release-khora-{libs,cli,server}.yml without publishing.
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - name: init submodules
        env:
          # Fine-grained PAT (or classic repo-scoped) with Contents: Read on private
          # khoralabs/* submodule remotes (libs, chat, …).
          TOKEN: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::KHORALABS_SUBMODULES_TOKEN secret is empty or unset"
            exit 1
          fi
          # scp-style git@host:path URLs often skip url.insteadOf; rewrite to HTTPS first.
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: verify submodules
        run: |
          set -euo pipefail
          test -d vendor/chat
          test -d vendor/libs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      # ── @khoralabs/khora-client (npm) ───────────────────────────────────────
      - name: typecheck khora-client and bundled deps
        run: |
          bun run --cwd packages/khora/contracts typecheck
          bun run --cwd packages/khora/auth typecheck
          bun run --cwd packages/khora/transport typecheck
          bun run --cwd packages/khora/client typecheck

      - name: test khora-client and bundled deps
        run: |
          bun test \
            packages/khora/contracts \
            packages/khora/auth \
            packages/khora/transport \
            packages/khora/client \
            scripts/stage-khora-libs-release.test.ts

      - name: build khora-client
        run: |
          bun run --cwd packages/khora/client build:schema
          bun run --cwd packages/khora/client build

      - name: stage khora-client release package
        run: bun run scripts/stage-khora-libs-release.ts 0.0.0-ci

      # ── khora-cli ──────────────────────────────────────────────────────────
      - name: typecheck khora-cli
        run: |
          bun run --cwd apps/cli typecheck
          bun run --cwd apps/daemon typecheck

      - name: test khora-cli
        run: |
          bun test \
            apps/cli \
            apps/daemon \
            scripts/stage-khora-release.test.ts \
            scripts/homebrew-formula.test.ts

      - name: build khora-cli linux-x64 smoke
        run: |
          bun run apps/cli/scripts/build.ts bun-linux-x64
          bun run apps/daemon/scripts/build.ts bun-linux-x64

      # ── khora-server ───────────────────────────────────────────────────────
      - name: install system sqlite libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlcipher1 libsqlite3-0

      - name: test khora-server packaging
        run: |
          bun test \
            scripts/homebrew-formula.test.ts \
            scripts/stage-khora-server-release.test.ts

      - name: build khora-server linux-x64 smoke
        run: bun run apps/server/scripts/build.ts bun-linux-x64
