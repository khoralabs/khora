name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Released surfaces: lockstep libs (client/registry/host), khora-cli, khora-server.
  # Mirrors the test/build gates of release-khora-{libs,cli,server}.yml without publishing.
  ci:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/checkout-khora
        with:
          token: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      # ── lockstep libs (client / registry / host) ────────────────────────────
      - name: typecheck khora libs and bundled deps
        run: |
          bun run --cwd packages/contracts typecheck
          bun run --cwd packages/auth typecheck
          bun run --cwd packages/client typecheck
          bun run --cwd packages/registry typecheck
          bun run --cwd packages/host typecheck

      - name: test khora libs
        run: |
          bun test \
            packages/contracts \
            packages/auth \
            packages/client \
            packages/registry \
            packages/host \
            scripts/release/libs/stage.test.ts \
            scripts/release/libs/build-publishable-lib.test.ts

      - name: build and stage khora libs
        run: |
          bun run --cwd packages/client build:schema
          bun run --cwd packages/client build
          bun run --cwd packages/registry build
          bun run --cwd packages/host build
          bun run scripts/release/libs/stage.ts 0.0.0-ci

      # ── khora-cli ──────────────────────────────────────────────────────────
      - name: typecheck khora-cli
        run: |
          bun run --cwd apps/cli typecheck
          bun run --cwd apps/daemon typecheck

      - name: test khora-cli
        run: |
          bun test \
            apps/cli \
            apps/daemon \
            scripts/release/cli/stage.test.ts \
            scripts/release/homebrew-formula.test.ts

      - name: build khora-cli linux-x64 smoke
        run: |
          bun run apps/cli/scripts/build.ts bun-linux-x64
          bun run apps/daemon/scripts/build.ts bun-linux-x64

      # ── khora-server ───────────────────────────────────────────────────────
      - name: install system sqlite libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlcipher1 libsqlite3-0

      - name: test khora-server packaging
        run: |
          bun test \
            scripts/release/homebrew-formula.test.ts \
            scripts/release/server/stage.test.ts

      - name: build khora-server linux-x64 smoke
        run: bun run apps/server/scripts/build.ts bun-linux-x64

      # ── khora-registry ───────────────────────────────────────────────────
      - name: test khora-registry packaging
        run: bun test scripts/release/registry/stage.test.ts

      - name: build khora-registry linux-x64 smoke
        run: bun run apps/registry/scripts/build.ts bun-linux-x64

      # ── CLI happy-path E2E (registry + server + cli + daemon) ─────────────
      - name: test khora e2e happy path
        timeout-minutes: 5
        run: bun run test:e2e
