name: release khora libs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep semver for khora-client, khora-registry, khora-host (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Dry-run pack/publish; skip git tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/checkout-khora
        with:
          token: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: |
          bun test \
            packages/contracts \
            packages/auth \
            packages/client \
            packages/registry \
            packages/host \
            scripts/release/libs/publish.test.ts \
            scripts/release/libs/build-publishable-lib.test.ts

      - name: bump lib versions
        run: |
          bun -e '
            import { bumpLibVersions } from "./scripts/release/libs/publish.ts";
            bumpLibVersions(process.cwd(), process.env.VERSION);
          '

      - name: refresh lockfile after version bump
        run: bun install

      - name: build client schema
        run: bun run --cwd packages/client build:schema

      - name: build libs
        run: |
          bun run --cwd packages/client build
          bun run --cwd packages/registry build
          bun run --cwd packages/host build

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "NPM_CONFIG_TOKEN=${NPM_TOKEN}" >> "$GITHUB_ENV"

      - name: publish libs (client → registry → host)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            bun run scripts/release/libs/publish.ts --dry-run --tag "$NPM_TAG"
          else
            bun run scripts/release/libs/publish.ts --tag "$NPM_TAG"
          fi

      - name: commit version bump
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/package.json packages/registry/package.json packages/host/package.json bun.lock
          if git diff --cached --quiet; then
            echo "::warning::version unchanged"
            exit 0
          fi
          HUSKY=0 git commit -m "release khora-libs v${VERSION}"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if HUSKY=0 git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${branch}..."
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push version bump after retries"
          exit 1

      - name: tag and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "khora-libs-v${VERSION}"
          HUSKY=0 git push origin "khora-libs-v${VERSION}"
