name: release khora libs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver to publish for @khoralabs/khora-client (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Run npm publish --dry-run; skip git tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot clone sibling private org repos (e.g. libs).
          # Submodules are initialized in the next step with KHORALABS_SUBMODULES_TOKEN.

      - name: init submodules
        env:
          # Fine-grained PAT (or classic repo-scoped) with Contents: Read on private
          # khoralabs/* submodule remotes (libs, …).
          TOKEN: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::KHORALABS_SUBMODULES_TOKEN secret is empty or unset"
            exit 1
          fi
          # scp-style git@host:path URLs often skip url.insteadOf; rewrite to HTTPS first.
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: |
          bun test packages/contracts packages/client scripts/stage-khora-libs-release.test.ts

      - name: build client schema
        run: bun run --cwd packages/client build:schema

      - name: build client
        run: bun run --cwd packages/client build

      - name: stage release package
        run: bun run scripts/stage-khora-libs-release.ts "$VERSION"

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: verify npm publish access
        run: |
          set -euo pipefail
          echo "npm user: $(npm whoami)"
          (cd release/khora-client && npm publish --access public --tag "$NPM_TAG" --dry-run)

      - name: publish client
        working-directory: release/khora-client
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --access public --tag "$NPM_TAG" --dry-run
          else
            npm publish --access public --tag "$NPM_TAG"
          fi

      - name: bump source version
        if: ${{ inputs.dry_run == false }}
        run: |
          node -e "
            const fs = require('node:fs');
            const p = 'packages/client/package.json';
            const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: commit version bump
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/package.json
          if git diff --cached --quiet; then
            echo "::warning::version unchanged"
            exit 0
          fi
          HUSKY=0 git commit -m "release khora-client v${VERSION}"
          # Other release workflows may push to main concurrently; rebase and retry.
          # --autostash: working tree may have unstaged noise that blocks rebase.
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if HUSKY=0 git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${branch}..."
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push version bump after retries"
          exit 1

      - name: tag and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "khora-client-v${VERSION}"
          HUSKY=0 git push origin "khora-client-v${VERSION}"
