name: release khora libs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep semver for khora-client, khora-registry, khora-host (e.g. 0.1.0)"
        required: true
        type: string
      tag:
        description: "npm dist-tag"
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next
      dry_run:
        description: "Run npm publish --dry-run; skip git tag/push"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VERSION: ${{ inputs.version }}
      NPM_TAG: ${{ inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/checkout-khora
        with:
          token: ${{ secrets.KHORALABS_SUBMODULES_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: test
        run: |
          bun test \
            packages/contracts \
            packages/auth \
            packages/client \
            packages/registry \
            packages/host \
            scripts/stage-khora-libs-release.test.ts \
            scripts/build-publishable-lib.test.ts

      - name: build client schema
        run: bun run --cwd packages/client build:schema

      - name: build libs
        run: |
          bun run --cwd packages/client build
          bun run --cwd packages/registry build
          bun run --cwd packages/host build

      - name: stage release packages
        run: bun run scripts/stage-khora-libs-release.ts "$VERSION"

      - name: configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is empty or unset"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"

      - name: verify npm publish access
        run: |
          set -euo pipefail
          echo "npm user: $(npm whoami)"
          for pkg in khora-client khora-registry khora-host; do
            (cd "release/${pkg}" && npm publish --access public --tag "$NPM_TAG" --dry-run)
          done

      - name: publish libs (client → registry → host)
        run: |
          set -euo pipefail
          for pkg in khora-client khora-registry khora-host; do
            echo "::group::publish ${pkg}"
            if [ "$DRY_RUN" = "true" ]; then
              (cd "release/${pkg}" && npm publish --access public --tag "$NPM_TAG" --dry-run)
            else
              (cd "release/${pkg}" && npm publish --access public --tag "$NPM_TAG")
            fi
            echo "::endgroup::"
          done

      - name: bump source versions
        if: ${{ inputs.dry_run == false }}
        run: |
          node -e "
            const fs = require('node:fs');
            for (const p of [
              'packages/client/package.json',
              'packages/registry/package.json',
              'packages/host/package.json',
            ]) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = process.env.VERSION;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: commit version bump
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/client/package.json packages/registry/package.json packages/host/package.json
          if git diff --cached --quiet; then
            echo "::warning::version unchanged"
            exit 0
          fi
          HUSKY=0 git commit -m "release khora-libs v${VERSION}"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if HUSKY=0 git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${branch}..."
            git fetch origin "${branch}"
            git rebase --autostash "origin/${branch}"
            sleep $((attempt * 2))
          done
          echo "::error::failed to push version bump after retries"
          exit 1

      - name: tag and push
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "khora-libs-v${VERSION}"
          HUSKY=0 git push origin "khora-libs-v${VERSION}"
