# Local end-to-end stack for the Atrium host + Litestream + sql-studio.
#
# Run from the repo root so the build contexts resolve correctly:
#
#   docker compose -f apps/atrium/host/docker/docker-compose.yml up --build
#
# First boot:
#   1. Wait for the minio service to come up.
#   2. Open http://localhost:9001 (minioadmin / minioadmin) and create the
#      `atrium-db` bucket.
#   3. Restart atrium-host so its Litestream replicate loop sees the bucket.
#   4. Browse http://localhost:3030 for sql-studio.

services:
  minio:
    build:
      context: ../../../..
      dockerfile: apps/atrium/host/docker/minio/Dockerfile
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  atrium-host:
    build:
      context: ../../../..
      dockerfile: apps/atrium/host/docker/host/Dockerfile
    depends_on:
      - minio
    environment:
      ATRIUM_DB_PATH: /data/atrium.db
      LITESTREAM_CONFIG: /etc/litestream.yml
      LITESTREAM_S3_ENDPOINT: http://minio:9000
      LITESTREAM_S3_BUCKET: atrium-db
      LITESTREAM_S3_PATH: prod
      LITESTREAM_ACCESS_KEY_ID: minioadmin
      LITESTREAM_SECRET_ACCESS_KEY: minioadmin
      PORT: "8787"
    ports:
      - "8787:8787"
    volumes:
      - host-data:/data

  sql-studio:
    build:
      context: ../../../..
      dockerfile: apps/atrium/host/docker/sql-studio/Dockerfile
    depends_on:
      - minio
    environment:
      DB_PATH: /data/db.sqlite
      LITESTREAM_CONFIG: /etc/litestream.yml
      LITESTREAM_S3_ENDPOINT: http://minio:9000
      LITESTREAM_S3_BUCKET: atrium-db
      LITESTREAM_S3_PATH: prod
      LITESTREAM_ACCESS_KEY_ID: minioadmin
      LITESTREAM_SECRET_ACCESS_KEY: minioadmin
      PORT: "3030"
    ports:
      - "3030:3030"
    volumes:
      - studio-data:/data

volumes:
  minio-data:
  host-data:
  studio-data:
