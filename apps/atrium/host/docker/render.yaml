# Render blueprint for the Atrium host stack.
#
# Three services on Render's private network:
#   minio        S3-compatible store (private API on minio.internal:9000,
#                console exposed publicly on :9001)
#   atrium-host  Bun-compiled host + Litestream sidecar; public on :8787
#   sql-studio   read-only SQLite viewer; private only on sql-studio.internal:3030
#                (restores from MinIO on boot; reach it via `render port-forward`)
#
# Render reads this file at the repo root by default. Either move it there,
# symlink it, or pass --blueprint-path when applying.
#
# After first apply:
#   1. Open the public minio console URL and create the `atrium-db` bucket.
#   2. Trigger a redeploy of atrium-host so Litestream picks up the bucket.

envVarGroups:
  # Non-secret shared S3 coordinates. The matching access keys are minted on the
  # `minio` service below (Render can't generate values inside an env group and
  # then re-export them under different keys to another service).
  - name: atrium-minio-s3
    envVars:
      - key: LITESTREAM_S3_ENDPOINT
        value: http://minio.internal:9000
      - key: LITESTREAM_S3_BUCKET
        value: atrium-db
      - key: LITESTREAM_S3_PATH
        value: prod

services:
  - type: pserv
    name: minio
    runtime: docker
    plan: starter
    dockerfilePath: apps/atrium/host/docker/minio/Dockerfile
    dockerContext: .
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: MINIO_ROOT_USER
        generateValue: true
      - key: MINIO_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: atrium-host
    runtime: docker
    plan: starter
    dockerfilePath: apps/atrium/host/docker/host/Dockerfile
    dockerContext: .
    disk:
      name: host-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - fromGroup: atrium-minio-s3
      - key: LITESTREAM_ACCESS_KEY_ID
        fromService:
          type: web
          name: minio
          envVarKey: MINIO_ROOT_USER
      - key: LITESTREAM_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: minio
          envVarKey: MINIO_ROOT_PASSWORD
      - key: ATRIUM_DB_PATH
        value: /data/atrium.db
      - key: MEMORIES_DIR
        value: /data/memories
      - key: LITESTREAM_CONFIG
        value: /etc/litestream.yml
      - key: PORT
        value: "8787"
      # ATRIUM_BASE_URL is derived at boot in host/entrypoint.sh from
      # RENDER_EXTERNAL_HOSTNAME. Override via the dashboard only if you
      # front the service with a custom domain.
      - key: ATRIUM_INVITE_PEPPER
        sync: false
      - key: ATRIUM_INVITES_PER_REGISTRATION
        sync: false
      - key: ATRIUM_INVITE_REQUIRED
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false

  - type: pserv
    name: sql-studio
    runtime: docker
    plan: starter
    dockerfilePath: apps/atrium/host/docker/sql-studio/Dockerfile
    dockerContext: .
    disk:
      name: studio-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - fromGroup: atrium-minio-s3
      - key: LITESTREAM_ACCESS_KEY_ID
        fromService:
          type: web
          name: minio
          envVarKey: MINIO_ROOT_USER
      - key: LITESTREAM_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: minio
          envVarKey: MINIO_ROOT_PASSWORD
      - key: DB_PATH
        value: /data/db.sqlite
      - key: LITESTREAM_CONFIG
        value: /etc/litestream.yml
      - key: PORT
        value: "3030"
