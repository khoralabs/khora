# Litestream config consumed by the host container.
#
# Env vars (set by Render env group or docker-compose):
#   LITESTREAM_ACCESS_KEY_ID       S3/MinIO access key
#   LITESTREAM_SECRET_ACCESS_KEY   S3/MinIO secret key
#   LITESTREAM_S3_ENDPOINT         e.g. http://minio.internal:9000
#   LITESTREAM_S3_BUCKET           e.g. atrium-db (bucket must pre-exist)
#   LITESTREAM_S3_PATH             prefix inside the bucket; defaults to 'prod'
#   ATRIUM_DB_PATH                 absolute path to the live SQLite file
access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
dbs:
  - path: ${ATRIUM_DB_PATH}
    replicas:
      - type: s3
        endpoint: ${LITESTREAM_S3_ENDPOINT}
        bucket: ${LITESTREAM_S3_BUCKET}
        path: ${LITESTREAM_S3_PATH:-prod}
        force-path-style: true
        sync-interval: 1s
        snapshot-interval: 1h
        retention: 72h
